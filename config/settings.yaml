# Runtime settings for the integrated planning and media pipeline.
# Relative paths are resolved against the repository root.
# AIVG_* environment variables override these values.

environment: development
log_level: INFO
json_logs: true

storage:
  root: artifacts
  temp_root: artifacts/.work
  registry_path: artifacts/artifact_registry.json

media:
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  probe_timeout_seconds: 60
  render_timeout_seconds: 1800

provider:
  id: deterministic_whiteboard
  gemini:
    model: gemini-omni-1.1-flash
    aspect_ratio: "16:9"
    resolution: "720p"
  whiteboard:
    width: 1280
    height: 720
    fps: 24
    preset: veryfast
    crf: 20
    narrator: auto
    tts_rate: 0

generation:
  max_attempts: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 8.0
  backoff_jitter_seconds: 0.25
  timeout_seconds: 600
  max_validation_attempts: 2
  sync_tolerance_seconds: 0.35

llm:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.2
  max_attempts: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 8.0
  backoff_jitter_seconds: 0.25
  timeout_seconds: 120
  max_output_tokens: 8192

planning:
  min_scene_duration_seconds: 5
  max_scene_duration_seconds: 120
  duration_tolerance_seconds: 0
  whiteboard_style: clean_whiteboard
  show_scene_title: true
  background_color: "#F8FAFC"
  accent_color: "#2563EB"
